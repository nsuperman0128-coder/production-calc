<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="生産数量">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>生産数量計算</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--input:#fff8d8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:auto;padding:18px 14px 34px}
.header{display:flex;align-items:center;gap:12px;margin:4px 2px 16px}
.logo{width:48px;height:48px;border-radius:14px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:800}
h1{font-size:23px;margin:0}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.title{font-weight:800;font-size:15px;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 128px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
label{font-size:14px;font-weight:700}
.hint{font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
input{width:100%;font-size:18px;text-align:right;padding:11px 10px;border-radius:12px;border:1px solid #d1d5db;background:var(--input)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:#f9fafb;border:1px solid var(--line);border-radius:14px;padding:12px}
.box.full{grid-column:1/-1;background:#eef2ff}
.k{font-size:11px;color:var(--muted)}
.v{font-size:22px;font-weight:800;margin-top:4px;word-break:break-all}
.full .v{font-size:30px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:800}
.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111}
.foot{font-size:11px;line-height:1.55;color:var(--muted);padding:0 4px}
@media(max-width:380px){.row{grid-template-columns:1fr 112px}.v{font-size:19px}.full .v{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><div class="logo">CT</div><div><h1>生産数量計算</h1><div class="sub">サイクルタイム → 日産・月産を自動計算</div></div></div>

  <div class="card">
    <div class="title">入力</div>
    <div class="row"><label>取り数<div class="hint">個 / ショット</div></label><input id="cav" type="number" inputmode="decimal" value="8" min="1"></div>
    <div class="row"><label>サイクルタイム<div class="hint">秒 / ショット</div></label><input id="ct" type="number" inputmode="decimal" value="90" step="0.1" min="0.1"></div>
    <div class="row"><label>稼働時間<div class="hint">時間 / 日</div></label><input id="hours" type="number" inputmode="decimal" value="24" step="0.5" min="0"></div>
    <div class="row"><label>稼働率<div class="hint">%</div></label><input id="uptime" type="number" inputmode="decimal" value="97" step="0.1" min="0" max="100"></div>
    <div class="row"><label>良品率<div class="hint">%</div></label><input id="yieldr" type="number" inputmode="decimal" value="97" step="0.1" min="0" max="100"></div>
    <div class="row"><label>稼働日数<div class="hint">日 / 月</div></label><input id="days" type="number" inputmode="numeric" value="22" min="0"></div>
  </div>

  <div class="card">
    <div class="title">結果</div>
    <div class="grid">
      <div class="box"><div class="k">CT（1個あたり）</div><div class="v" id="r1">-</div></div>
      <div class="box"><div class="k">1時間あたり</div><div class="v" id="r2">-</div></div>
      <div class="box"><div class="k">1日あたり（理論）</div><div class="v" id="r3">-</div></div>
      <div class="box"><div class="k">1日あたり（良品）</div><div class="v" id="r4">-</div></div>
      <div class="box full"><div class="k">月間良品数量（単輪）</div><div class="v" id="r5">-</div></div>
      <div class="box full"><div class="k">月間良品数量（双輪）</div><div class="v" id="r6">-</div></div>
    </div>
  </div>

  <div class="card">
    <div class="btns">
      <button class="secondary" id="reset">初期値</button>
      <button class="primary" id="copy">結果をコピー</button>
    </div>
  </div>

  <div class="foot">ホーム画面に追加すると全画面表示になり、普通のアプリに近い使い方ができます。初回表示後はオフラインでも動作します。</div>
</div>
<script>
const $=x=>document.getElementById(x);
const ids=['cav','ct','hours','uptime','yieldr','days'];
const def={cav:8,ct:90,hours:24,uptime:97,yieldr:97,days:22};
const val=x=>parseFloat($(x).value)||0;
const fmt=(n,d=0)=>Number.isFinite(n)?n.toLocaleString('ja-JP',{maximumFractionDigits:d}):'-';

function calc(){
 const cav=val('cav'),ct=val('ct'),h=val('hours'),u=val('uptime')/100,y=val('yieldr')/100,d=val('days');
 if(cav<=0||ct<=0){['r1','r2','r3','r4','r5','r6'].forEach(x=>$(x).textContent='-');return;}
 const ct1=ct/cav, hourly=3600/ct1, daily=hourly*h, good=daily*u*y, monthly=good*d;
 $('r1').textContent=fmt(ct1,3)+' 秒';
 $('r2').textContent=fmt(hourly)+' 個';
 $('r3').textContent=fmt(daily)+' 個';
 $('r4').textContent=fmt(good)+' 個';
 $('r5').textContent=fmt(monthly)+' 個';
 $('r6').textContent=fmt(monthly/2)+' 台';
 localStorage.setItem('prodcalc',JSON.stringify(Object.fromEntries(ids.map(id=>[id,$(id).value]))));
}
ids.forEach(id=>$(id).addEventListener('input',calc));
$('reset').onclick=()=>{Object.entries(def).forEach(([k,v])=>$(k).value=v);calc();}
$('copy').onclick=async()=>{
 const s=`【生産数量計算】
取り数：${val('cav')}
サイクルタイム：${val('ct')} 秒
稼働時間：${val('hours')} 時間/日
稼働率：${val('uptime')}%
良品率：${val('yieldr')}%
稼働日数：${val('days')} 日
月間良品数量（単輪）：${$('r5').textContent}
月間良品数量（双輪）：${$('r6').textContent}`;
 try{await navigator.clipboard.writeText(s);const b=$('copy');const t=b.textContent;b.textContent='コピー済み';setTimeout(()=>b.textContent=t,1200)}catch(e){alert(s)}
}
try{const saved=JSON.parse(localStorage.getItem('prodcalc')||'null');if(saved)ids.forEach(id=>{if(saved[id]!=null)$(id).value=saved[id]})}catch(e){}
calc();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
